name: Weekly snapshot freshness

# datos.hcdn.gob.ar refuses connections from GitHub's runners, so the data is refreshed on the owner's Mac
# (scripts/weekly-refresh.sh via launchd, Mondays 06:00 Argentina) and pushed as a snapshot. This job runs
# later that day and fails when the snapshot is older than 14 days, so a stopped refresh gets noticed.
on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC (12:00 in Argentina)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the data snapshot age
        run: node scripts/snapshot-age.ts 14 | tee -a "$GITHUB_STEP_SUMMARY"
