<feComponentTransfer in="edge" result="pool"><feFuncR type="linear" slope="0.62"/><feFuncG type="linear" slope="0.7"/><feFuncB type="linear" slope="0.84"/><feFuncA type="linear" slope="2.4"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.0117" numOctaves="4" seed="9" result="m"/>
