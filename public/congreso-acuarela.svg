<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><title>Palacio del Congreso de la Nación Argentina pintado en acuarela celeste: cúpula sobre tambor con columnas, linterna, pórtico con frontón y alas laterales</title><defs><filter id="hero-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
